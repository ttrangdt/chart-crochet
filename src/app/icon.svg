  <circle cx="256" cy="256" r="220" fill="#F8BBD0" opacity="0.85" />
  <circle cx="256" cy="256" r="195" fill="none" stroke="#E91E63" stroke-width="8" stroke-dasharray="16 12" />

  <!-- Sợi len cuộn xung quanh biểu tượng -->
